[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "IFCG"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "matplotlib"]
[project.scripts]
ifcg = "ifcg:main"
[tool.setuptools]
py-modules = ["ifcg"]
