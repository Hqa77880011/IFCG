name: Code
on: [push, pull_request, workflow_dispatch]
jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install .
      - run: python -m compileall -q ifcg.py
      - run: python -c "import ifcg"
